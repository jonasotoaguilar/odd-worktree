name: Feature Request
description: Propose a new capability or enhancement
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## How this works

        1. **Submit** this feature request → it gets the `enhancement` label automatically
        2. A **maintainer reviews** it and either scopes it or closes it as out of scope/duplicate
        3. An implementation lands as a PR that references this issue

        This package is the worktree / ODD / issue-reader surface only; features
        that belong to the host (Pi, Herdr, Gentle Shell) are out of scope here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I checked existing issues and this is not a duplicate
          required: true
        - label: I read the README "Deliberately absent" section and this is not one of those excluded surfaces
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of this package does it change?
      options:
        - worktree_create
        - worktree_list
        - worktree_close
        - worktree_warp
        - /warp panel (create, list, delete)
        - /odd-list viewer
        - /issues reader
        - Registry and session state
        - CI / Build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Explain clearly.
      placeholder: |
        Currently I can't...
        The current flow fails when...
        To do X today I have to manually do Y...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: The behavior you expect. Be as specific as possible about the command, panel, or tool that changes.
      placeholder: |
        Example:
        - New flag or argument on <tool>
        - What the panel should show
        - What the final result should look like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches, tradeoffs, or the workaround you use today.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Examples, references, or constraints the implementation must respect.
    validations:
      required: false
