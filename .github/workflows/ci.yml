name: CI

# Two gates: `node --test tools/*.test.js` (package.json `test`) on every
# Node the range `engines` declares (>=18), 18.x as its floor, and the shell
# API's own suite (`node --test tools/shell-api/*.test.ts
# tools/shell-api/*.test.mjs`, package.json `test:shell-api`) on the two
# versions that can strip its TypeScript: 22.x (from 22.18) and 24.x. Neither
# needs an install step or a lockfile — both use Node builtins only. Pushes are
# covered by branch, PRs by every base: a same-repo branch push runs once,
# through the PR, instead of twice.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: node --test tools/*.test.js

      # native-bridge T5: the shell API is this package's own code, so its
      # suite lives with the other tests (`tools/shell-api/`). It is TypeScript,
      # so it needs type stripping, which is on by default from Node 22.18, and
      # it is skipped below that rather than failing on a syntax error.
      - name: Run the shell API's suite
        if: matrix.node == '22.x' || matrix.node == '24.x'
        run: node --test tools/shell-api/*.test.ts tools/shell-api/*.test.mjs
